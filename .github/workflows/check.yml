name: Build and verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check development prerequisites
        run: python dev.py doctor
      - name: Build and run regression and loopback HTTP checks
        run: python dev.py check
      - name: Verify role-separated community portals with real HTTP sessions
        run: python tools/check_role_portals.py
      - name: Verify standalone login form and redirect lifecycle
        run: node --test tools/test_community_login.mjs
      - name: Verify responsive Swing layouts
        run: python tools/render_ui_layout.py --check --out tmp/ui-layout-ci
      - name: Verify beginner guidance at default and minimum window sizes
        run: python tools/render_ui_layout.py --guide-only --check --out tmp/ui-guide-ci
      - name: Verify Scope editor at default and minimum window sizes
        run: python tools/render_ui_layout.py --scope-only --check --out tmp/ui-scope-ci
      - name: Verify Pretty Raw Hex and packet Search layouts
        run: python tools/render_ui_layout.py --packet-only --sizes 1024x720 1280x800 --check --out tmp/ui-packet-ci
      - name: Verify JS text analysis workspace and modeless windows
        run: python tools/render_ui_layout.py --js-only --sizes 1024x720 1280x800 --check --out tmp/ui-js-ci
      - name: Verify cookie session inspector at default and minimum sizes
        run: python tools/render_ui_layout.py --session-only --check --out tmp/ui-session-ci
      - name: Verify authorization policy and effect verification layouts
        run: python tools/render_ui_layout.py --auth-only --sizes 1024x720 1280x800 --check --out tmp/ui-auth-ci
      - name: Verify server discovery controls evidence and history layouts
        run: python tools/render_ui_layout.py --environment-only --sizes 1024x720 1280x800 --check --out tmp/ui-environment-ci
      - name: Check packaging invariants
        run: python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Verify versioned downloads match current sources
        run: python tools/package_downloads.py --verify
      - name: Upload verified extension
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: burp-workbench-kr-${{ github.sha }}
          path: project/burp-development-workspace/burp-workbench-kr/burp-workbench/dist/burp-workbench-kr-*.jar
          if-no-files-found: error
          retention-days: 14
      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-${{ github.sha }}
          include-hidden-files: true
          path: |
            project/burp-development-workspace/burp-workbench-kr/burp-workbench/build/test-*.txt
            project/burp-development-workspace/burp-workbench-kr/burp-workbench/validation/all-features/.run/tests.txt
            project/burp-development-workspace/burp-workbench-kr/burp-workbench/validation/all-features/.run/results.json
            project/burp-development-workspace/burp-workbench-kr/burp-workbench/validation/all-features/.run/server.log
            audit/0.23.0/.run/results.json
            audit/0.23.0/.run/integrity.json
            audit/0.23.0/.run/audit.log
            audit/0.23.0/.run/server.log
            tmp/role-portals/results.json
            tmp/role-portals/server.log
            tmp/ui-layout-ci/controls.csv
            tmp/ui-layout-ci/content.csv
            tmp/ui-layout-ci/layout-report.json
            tmp/ui-layout-ci/text.csv
            tmp/ui-guide-ci/layout-report.json
            tmp/ui-guide-ci/guides.csv
            tmp/ui-scope-ci/layout-report.json
            tmp/ui-scope-ci/controls.csv
            tmp/ui-scope-ci/content.csv
            tmp/ui-packet-ci/layout-report.json
            tmp/ui-packet-ci/controls.csv
            tmp/ui-packet-ci/content.csv
            tmp/ui-js-ci/layout-report.json
            tmp/ui-js-ci/controls.csv
            tmp/ui-js-ci/content.csv
            tmp/ui-session-ci/layout-report.json
            tmp/ui-session-ci/controls.csv
            tmp/ui-session-ci/content.csv
            tmp/ui-auth-ci/layout-report.json
            tmp/ui-auth-ci/controls.csv
            tmp/ui-auth-ci/content.csv
            tmp/ui-auth-ci/text.csv
            tmp/ui-environment-ci/layout-report.json
            tmp/ui-environment-ci/controls.csv
            tmp/ui-environment-ci/content.csv
            tmp/ui-environment-ci/text.csv
          if-no-files-found: warn
          retention-days: 14

