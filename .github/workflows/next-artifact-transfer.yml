name: Temporary Next artifact transfer
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/next-artifact-transfer.yml']
permissions:
  contents: read
jobs:
  transfer:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'account-a/next-0560-custom-agent'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Export already verified public JAR as bounded text chunks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,json
          source=Path('downloads/extensions/0.56.0/burp-workbench-kr-0.56.0.jar')
          data=source.read_bytes()
          published=json.loads((source.parent/'manifest.json').read_text())['files'][source.name]
          assert hashlib.sha256(data).hexdigest()==published
          root=Path('transfer/next-0560');root.mkdir(parents=True,exist_ok=True)
          parts=[]
          for index,offset in enumerate(range(0,len(data),196608)):
              chunk=data[offset:offset+196608];name=f'part-{index:03d}.b64'
              (root/name).write_text(base64.b64encode(chunk).decode()+'\n')
              parts.append({'file':name,'sha256':hashlib.sha256(chunk).hexdigest(),'size':len(chunk)})
          (root/'manifest.json').write_text(json.dumps({'name':source.name,'sha256':published,'size':len(data),'parts':parts},indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add transfer/next-0560 docs/chat-logs/2026-11-15/next-custom-agent.md
          git commit -m 'build: temporary public artifact text transfer for local delivery'
          git push origin HEAD:refs/heads/account-a/next-0560-custom-agent
