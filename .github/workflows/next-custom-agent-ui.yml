name: Next Custom AI Agent focused UI verification
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/next-custom-agent-ui.yml'
      - 'tools/UiLayoutPreview.java'
      - 'tools/render_ui_layout.py'
permissions:
  contents: read
jobs:
  layouts:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'account-a/next-0560-custom-agent'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build and boot the actual upstream component
        run: |
          python dev.py build
          python tools/check_custom_agent.py
          python feature-mapper/build.py --test
      - name: Full responsive Swing layouts with the unchanged fixture
        run: python tools/render_ui_layout.py --check --out tmp/ui-layout-agent
      - name: Focused production views
        run: |
          python tools/render_ui_layout.py --traffic-only --sizes 1024x720 1280x800 --check --out tmp/ui-agent-traffic
          python tools/render_ui_layout.py --guide-only --check --out tmp/ui-agent-guide
          python tools/render_ui_layout.py --scope-only --check --out tmp/ui-agent-scope
          python tools/render_ui_layout.py --packet-only --sizes 1024x720 1280x800 --check --out tmp/ui-agent-packet
          python tools/render_ui_layout.py --js-only --sizes 1024x720 1280x800 --check --out tmp/ui-agent-js
          python tools/render_ui_layout.py --session-only --check --out tmp/ui-agent-session
          python tools/render_ui_layout.py --auth-only --sizes 1024x720 1280x800 --check --out tmp/ui-agent-auth
          python tools/render_ui_layout.py --environment-only --sizes 1024x720 1280x800 --check --out tmp/ui-agent-environment
      - name: Packaging invariants and frozen source fingerprints
        run: |
          python -m unittest discover -s tools -p 'test_*.py' -v
          python tools/package_downloads.py --verify
      - name: Upload layout evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: next-agent-layouts-${{ github.event.pull_request.head.sha }}
          path: |
            tmp/ui-layout-agent/
            tmp/ui-agent-*/
            build/custom-agent-check/
          retention-days: 14
