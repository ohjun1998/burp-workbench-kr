name: Publish capture recovery 0.25.1

on:
  push:
    branches: ['account-a/0.25.1-capture-recovery']

permissions:
  contents: write

concurrency:
  group: publish-capture-0251
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build, test, and package versioned downloads
        run: python dev.py release
      - name: Verify responsive layouts and guide
        run: |
          python tools/render_ui_layout.py --check --out tmp/ui-layout-publication
          python tools/render_ui_layout.py --guide-only --check --out tmp/ui-guide-publication
          python -m unittest discover -s tools -p 'test_*.py' -v
          python tools/package_downloads.py --verify
      - name: Record verified CI publication
        env:
          EXPECTED_SOURCE_SHA256: '35b5e1263a7fb26e4d9a5d986a96175fed989a637e135ff5ce9b079427ec598d'
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          root = Path('.')
          folder = root / 'downloads/extensions/0.25.1'
          files = {p.name: hashlib.sha256(p.read_bytes()).hexdigest()
                   for p in folder.iterdir() if p.suffix in ('.jar', '.zip')}
          assert files['burp-workbench-kr-0.25.1-source.zip'] == os.environ['EXPECTED_SOURCE_SHA256'], 'Source archive differs from locally verified sources'
          report = {
              'sourceCommit': os.environ['GITHUB_SHA'],
              'workflowRun': os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'],
              'files': files,
              'checks': ['python dev.py release', 'responsive Swing layouts', 'beginner guide layouts', 'packaging invariants', 'download hashes and source fingerprints'],
              'nativeBurpExecuted': False,
              'note': 'CI rebuilt and verified the same source archive; original local verification remains recorded separately.'
          }
          (root / 'docs/CI_PUBLICATION_0.25.1.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Save verified JAR and source to task branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/extensions/0.25.1 docs/CI_PUBLICATION_0.25.1.json
          git diff --cached --quiet && exit 0
          git commit -m 'build: publish verified 0.25.1 capture recovery artifacts'
          git push origin HEAD:refs/heads/account-a/0.25.1-capture-recovery
      - name: Upload release files
        uses: actions/upload-artifact@v7
        with:
          name: burp-workbench-kr-0.25.1-release
          path: downloads/extensions/0.25.1/
          if-no-files-found: error
