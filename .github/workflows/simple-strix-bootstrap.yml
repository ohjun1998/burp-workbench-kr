name: Simple Strix public source bootstrap
on:
  push:
    branches: ['account-a/simple-strix-local']
    paths: ['.github/workflows/simple-strix-bootstrap.yml']
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Export public build inputs
        run: |
          python - <<'PY'
          import base64,hashlib,json,subprocess,zipfile
          from pathlib import Path
          names=subprocess.check_output(['git','ls-files','-z','simple']).decode().split('\0')
          prefixes=('simple/burp-workbench/','simple/feature-mapper/','simple/tools/')
          named={'simple/dev.py','simple/package_simple.py','simple/README_KR.md','simple/REGRESSION_PROFILE_KR.md','simple/.gitignore'}
          selected=[n for n in names if n and (n.startswith(prefixes) or n in named)]
          out=Path('_transfer/simple-strix');out.mkdir(parents=True,exist_ok=True)
          archive=out/'source.zip'
          with zipfile.ZipFile(archive,'w',zipfile.ZIP_DEFLATED) as z:
              for n in selected:z.write(n,n)
          data=archive.read_bytes();parts=[]
          for i,start in enumerate(range(0,len(data),393216)):
              path=out/f'part-{i:03}.b64';path.write_text(base64.b64encode(data[start:start+393216]).decode());parts.append(path.name)
          archive.unlink()
          (out/'manifest.json').write_text(json.dumps({'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data),'parts':parts,'files':len(selected)},indent=2)+'\n')
          log=Path('docs/chat-logs/2026-11-16/simple-strix-local.md')
          log.write_text(log.read_text()+'\n공개 저장소의 Simple 빌드 입력을 로컬 검증용으로 임시 전송했다. 비공개 설정과 진단 자료는 포함하지 않았다.\n')
          PY
      - name: Commit public transfer on task branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _transfer/simple-strix docs/chat-logs/2026-11-16/simple-strix-local.md
          git commit -m "Export public Simple inputs for local integration build"
          git push origin HEAD:refs/heads/account-a/simple-strix-local
