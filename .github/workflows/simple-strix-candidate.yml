name: Simple Strix release candidate
on:
  push:
    branches: ['account-a/simple-strix-local']
    paths: ['simple/**', '.github/workflows/simple-strix-candidate.yml']
permissions:
  contents: write
concurrency:
  group: simple-strix-candidate
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Complete strict Java 17 Simple regression profile
        run: python simple/dev.py check
      - name: Retest report parsing and immutable report inputs
        run: |
          python -m unittest discover -s audit/simple-retest -p test_build_report.py -v
          python -m unittest discover -s audit/simple-navigation-retest -p 'test_*.py' -v
      - name: Verify real Katana against isolated fixtures
        run: |
          python simple/tools/install_katana.py --dest "$RUNNER_TEMP/workbench-katana" --platform linux_amd64
          python simple/tools/verify_katana.py --katana "$RUNNER_TEMP/workbench-katana/katana" --out tmp/katana-integration
      - name: Verify existing Simple layouts
        run: |
          python simple/tools/render_simple.py --out tmp/simple-layout --check
          python simple/tools/render_scope_inspection.py --out tmp/simple-inspection-layout --check
      - name: Verify Strix integration layouts without actual Strix or model requests
        run: python simple/tools/render_strix.py --out tmp/simple-strix-layout --check
      - name: Package immutable Simple 1.4.13 artifacts
        run: |
          python simple/dev.py package
          python simple/dev.py verify
      - name: Prepare public release transfer and evidence
        run: |
          python - <<'PY'
          import base64,hashlib,json,shutil,subprocess
          from pathlib import Path
          folder=Path('simple/downloads/1.4.13')
          jar=folder/'burp-workbench-simple-1.4.13.jar'
          data=jar.read_bytes()
          out=Path('_transfer/simple-strix-release');out.mkdir(parents=True,exist_ok=True)
          parts=[]
          for i,start in enumerate(range(0,len(data),393216)):
              p=out/f'part-{i:03}.b64';p.write_text(base64.b64encode(data[start:start+393216]).decode());parts.append(p.name)
          (out/'manifest.json').write_text(json.dumps({'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data),'parts':parts},indent=2)+'\n')
          report=Path('docs/reports/2026-11-16-simple-strix-local');report.mkdir(parents=True,exist_ok=True)
          summary=json.loads(Path('simple/burp-workbench/build/check-summary.json').read_text())
          summary['testedSourceHead']=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          summary['nativeStrixRun']=False
          summary['actualModelInference']=False
          summary['nativeBurpGuiVerified']=False
          (report/'candidate-check.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n')
          for name in ['test-SimpleStrixClientTest.txt','test-SimpleStrixIntegrationTest.txt']:
              src=Path('simple/burp-workbench/build')/name
              if src.exists():shutil.copy2(src,report/name)
          log=Path('docs/chat-logs/2026-11-16/simple-strix-local.md')
          log.write_text(log.read_text()+'\nCI에서 전체 Simple 검사와 UI·Katana를 통과한 경우에만 1.4.13 배포 파일을 생성한다. Strix 실제 진단·모델 추론은 수행하지 않는다.\n')
          PY
      - name: Publish reviewed artifacts only on the task branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simple/downloads/1.4.13 _transfer/simple-strix-release docs/reports/2026-11-16-simple-strix-local docs/chat-logs/2026-11-16/simple-strix-local.md
          git commit -m "Publish verified Simple 1.4.13 candidate artifacts"
          git push origin HEAD:refs/heads/account-a/simple-strix-local
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: simple-strix-candidate
          path: |
            simple/burp-workbench/build/test-*.txt
            simple/burp-workbench/build/*summary.json
            tmp/simple-layout/**/*.png
            tmp/simple-layout/*.json
            tmp/simple-inspection-layout/**/*.png
            tmp/simple-inspection-layout/*.json
            tmp/simple-strix-layout/**/*
          retention-days: 14
