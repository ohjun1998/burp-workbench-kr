name: Usability 0.53.1 release candidate verification
on:
  push:
    branches: [account-a/usability-0531-20261026]
    paths:
      - 'project/**'
      - 'feature-mapper/**'
      - 'tools/**'
      - 'dev.py'
      - 'audit/usability0531/**'
      - '.github/workflows/usability-release-candidate.yml'
permissions:
  contents: read
concurrency:
  group: next-candidate-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Build, regressions, loopback HTTP, and immutable release packages
        run: python dev.py release --port 19453 --bounty-port 19454
      - name: Check release fingerprints and packaging invariants
        run: |
          python tools/package_downloads.py --verify
          python -m unittest discover -s tools -p 'test_*.py' -v
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: usability0531-candidate-packages
          retention-days: 14
          path: |
            downloads/extensions/0.53.1/
            downloads/feature-mapper/0.3.5/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: usability0531-linux-evidence
          include-hidden-files: true
          retention-days: 14
          path: |
            project/burp-development-workspace/burp-workbench-kr/burp-workbench/build/test-*.txt
            project/burp-development-workspace/burp-workbench-kr/burp-workbench/build/*summary.json
            project/burp-development-workspace/burp-workbench-kr/burp-workbench/validation/all-features/.run/results.json
            audit/0.23.0/.run/results.json
            feature-mapper/build/test-results.txt
  layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build current packaged UI and compile its test adapters
        run: |
          python dev.py build
          python - <<'PYTHON'
          from pathlib import Path
          import os, subprocess
          wb = Path('project/burp-development-workspace/burp-workbench-kr/burp-workbench').resolve()
          classes = wb / 'build/tests'
          classes.mkdir(parents=True, exist_ok=True)
          cp = os.pathsep.join(str(p) for p in [wb / 'dist/burp-workbench-kr-0.53.1.jar', *sorted((wb / 'deps').glob('*.jar'))])
          subprocess.run(['javac', '--release', '17', '-encoding', 'UTF-8', '-cp', cp, '-d', str(classes), *map(str, (wb / 'src/test/java').rglob('*.java'))], check=True)
          PYTHON
      - name: Check current usability views and remaining-work navigation
        run: python tools/render_ui_layout.py --next-only --check --out tmp/usability0531-ui
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: usability0531-layout-evidence
          include-hidden-files: true
          retention-days: 14
          path: tmp/usability0531-ui/
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Windows Java and loopback regression checks
        run: python dev.py check --port 19453 --bounty-port 19454
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: usability0531-windows-evidence
          include-hidden-files: true
          retention-days: 14
          path: |
            project/burp-development-workspace/burp-workbench-kr/burp-workbench/build/test-*.txt
            project/burp-development-workspace/burp-workbench-kr/burp-workbench/build/*summary.json
            project/burp-development-workspace/burp-workbench-kr/burp-workbench/validation/all-features/.run/results.json
            audit/0.23.0/.run/results.json
            feature-mapper/build/test-results.txt
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Build and test browser helper and Mapper
        run: python feature-mapper/build.py --test
      - name: Install isolated browser fixture
        run: |
          npm install --prefix "$RUNNER_TEMP/mapper-node" --ignore-scripts --no-audit --no-fund playwright-core@1.64.0
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/chrome.zip" 'https://storage.googleapis.com/chrome-for-testing-public/154.0.8037.57/linux64/chrome-linux64.zip'
          unzip -q "$RUNNER_TEMP/chrome.zip" -d "$RUNNER_TEMP/mapper-chrome"
      - name: Real Chromium helper and exact POST/PATCH body correlation
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/mapper-node/node_modules/playwright-core
          NODE_OPTIONS: --import=./audit/0.49.0/browser-ci-diagnostics.mjs
        run: python feature-mapper/tests/run_browser.py --browser "$RUNNER_TEMP/mapper-chrome/chrome-linux64/chrome" --output feature-mapper/build/browser-verification
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: usability0531-browser-evidence
          retention-days: 14
          path: |
            feature-mapper/build/test-results.txt
            feature-mapper/build/browser-verification/
