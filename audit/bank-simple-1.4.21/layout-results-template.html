<script>
'use strict';
const D=JSON.parse(document.getElementById('layout-data').textContent);
const UI={page:'traffic',q:'',sel:{},tabs:{},metric:'paths',severity:'',category:'',authActor:'wb_bob',feature:'all',jsSource:0};
const PAGES=[
 ['scope','통합 점검','통합 점검'],['dashboard','대시보드','통합 점검'],
 ['traffic','요청·응답 목록','트래픽'],['mapper','기능 자동 매핑','트래픽'],
 ['js','JS에서 API 찾기','탐색·정보 수집'],['environment','서버·경로 탐색','탐색·정보 수집'],['exposure','외부 노출·CVE 조사','탐색·정보 수집'],
 ['auth','계정 권한 비교','보안 분석·검증'],['response','응답 보안 분석','보안 분석·검증'],['payload','입력값 보안 검사','보안 분석·검증'],
 ['data','데이터 변환·비교','데이터 도구'],['activity','점검 진행 현황','점검 관리·증거'],['bounty','재현·증거 정리','점검 관리·증거']
];
const ROOT=document.getElementById('page');
const E=value=>String(value===undefined||value===null?'—':value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const json=value=>typeof value==='string'?value:JSON.stringify(value,null,2);
const count=value=>Number(value||0).toLocaleString('ko-KR');
const path=url=>{try{const u=new URL(url,D.metadata.baseUrl);return u.pathname+u.search+u.hash}catch(e){return String(url||'—')}};
const actor=name=>name==='anonymous'?'비로그인':name==='unknown'?'미확인':name||'—';
const filtered=rows=>!UI.q?rows:rows.filter(r=>JSON.stringify(r).toLocaleLowerCase().includes(UI.q.toLocaleLowerCase()));
const badge=(text,kind='neutral')=>'<span class="badge '+kind+'">'+E(text)+'</span>';
const status=code=>badge(code,code>=500?'bad':code>=400?'warn':code>=200&&code<300?'ok':'neutral');
const labelKind=k=>({REFERENCE:'기준',SUSPECT:'우회 의심',ALLOWED:'정상 허용',BLOCKED:'차단 확인',NONE:'미확인'}[k]||k||'—');
const kindBadge=k=>badge(labelKind(k),k==='SUSPECT'?'warn':k==='REFERENCE'?'info':k==='ALLOWED'||k==='BLOCKED'?'ok':'neutral');
const icon=name=>{const paths={traffic:'M3 17V9m6 8V4m6 13v-6M2 20h19',mapper:'M8 3h8v5H8zM3 16h6v5H3zM15 16h6v5h-6zM12 8v4M6 16v-4h12v4',js:'m8 6-6 6 6 6m8-12 6 6-6 6m-3-15-2 18',environment:'m12 2 10 6-10 6L2 8l10-6zm-10 11 10 6 10-6m-20 5 10 6 10-6',auth:'M6 21v-4a6 6 0 0 1 12 0v4M12 10a4 4 0 1 0 0-8 4 4 0 0 0 0 8',response:'m12 2 9 4v7c0 5-9 9-9 9s-9-4-9-9V6l9-4zm-4 10 3 3 6-7',payload:'M6 10h12v12H6zM8 10V6a4 4 0 0 1 8 0v4',data:'M2 3h8v8H2zm12 0h8v8h-8zM2 15h8v8H2zm12 0h8v8h-8z',activity:'m3 12 5 5L21 4',bounty:'M6 2h9l4 4v16H6zM14 2v6h5M9 12h7m-7 4h7',dashboard:'M2 3h20v18H2zm0 6h20M8 9v12',scope:'M12 2a10 10 0 1 0 10 10M12 6a6 6 0 1 0 6 6M12 10a2 2 0 1 0 2 2m-2 0 9-9',exposure:'M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16zm6-2 6 6'};return '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+(paths[name]||paths.response)+'"/></svg>'};
function navigation(){let out='<div class="nav-primary">';PAGES.slice(0,2).forEach(p=>{out+='<button class="nav-item '+(p[0]==='scope'?'scope-special':'dashboard-special')+(UI.page===p[0]?' active':'')+'" data-nav="'+p[0]+'">'+icon(p[0])+'<span>'+p[1]+'</span><span>›</span></button>'});out+='</div>';let group='';for(const p of PAGES.slice(2)){if(p[2]!==group){if(group)out+='</div>';group=p[2];out+='<div class="nav-group"><div class="nav-label">'+group+'</div>'}out+='<button class="nav-item'+(UI.page===p[0]?' active':'')+'" data-nav="'+p[0]+'">'+icon(p[0])+'<span>'+p[1]+'</span></button>'}document.getElementById('navigation').innerHTML=out+'</div>'}
function card(title,body,cls='',tools=''){return '<section class="card '+cls+'"><div class="card-head"><strong>'+E(title)+'</strong><span class="grow"></span>'+tools+'</div>'+body+'</section>'}
function raw(text){const value=String(text===undefined||text===null?'':text);let display=E(value);if(/^[\s]*[\[{]/.test(value)){try{JSON.parse(value);const tokens=/"(?:\\.|[^"\\])*"|\b(?:true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?/g;let match,last=0,out='';while((match=tokens.exec(value))){out+=E(value.slice(last,match.index));const token=match[0];const type=token[0]==='"'?(/^\s*:/.test(value.slice(match.index+token.length))?'json-key':'json-string'):/^(true|false|null)$/.test(token)?'json-literal':'json-number';out+='<span class="'+type+'">'+E(token)+'</span>';last=match.index+token.length}display=out+E(value.slice(last))}catch(error){}}return '<pre class="raw code">'+display+'</pre>'}
function kv(entries){return '<div class="kv">'+entries.map(([key,value])=>'<div class="kv-row"><span class="muted">'+E(key)+'</span><span class="break">'+E(value)+'</span></div>').join('')+'</div>'}
function empty(text='조건에 맞는 저장 결과가 없습니다.'){return '<div class="empty">'+E(text)+'</div>'}
function tabs(key,options){const active=UI.tabs[key]||options[0][0];return '<div class="tabbar">'+options.map(o=>'<button class="tab'+(active===o[0]?' active':'')+'" data-tab="'+key+'" data-value="'+o[0]+'">'+E(o[1])+'</button>').join('')+'</div>'}
function table(key,rows,columns,selected=null){return '<div class="table-wrap" data-scroll="'+key+'"><table class="data-table"><thead><tr>'+columns.map(c=>'<th>'+E(c.label)+'</th>').join('')+'</tr></thead><tbody>'+rows.map((r,i)=>'<tr tabindex="0" data-row="'+key+'" data-index="'+i+'" class="'+(selected===i?'selected':'')+'" aria-selected="'+(selected===i)+'">'+columns.map(c=>'<td>'+(c.html?c.html(r,i):E(c.value?c.value(r,i):r[c.key]))+'</td>').join('')+'</tr>').join('')+'</tbody></table>'+(!rows.length?empty():'')+'</div>'}
function selected(key,rows,predicate){let i=UI.sel[key];if(i===undefined){i=predicate?rows.findIndex(predicate):0;if(i<0)i=0;UI.sel[key]=i}if(i>=rows.length)i=0;return {row:rows[i],index:i}}
function packetFor(url,who=null,code=null,dataset='core'){const rows=D.packets[dataset]||[];return rows.find(p=>p.url===url&&(!who||p.actor===who)&&(code===null||Number(p.status)===Number(code)))||null}
function originalPacket(id){return (D.packets.core||[]).find(p=>(p.originalIds||[]).includes(id)||p.originalId===id)||null}
function packetNote(packet,side){if(!packet)return '';const s=packet[side];return '<div class="detail-note">'+(s.note?E(s.note):'가림 표시본')+(s.truncated?' · 본문 일부':'')+'</div>'}
function sideContent(packet,side,mode='value'){if(!packet)return empty('이 항목의 원문은 저장된 결과에 포함되지 않았습니다.');const s=packet[side];return raw(mode==='http'?s.safeText:(s.bodyJson!==null&&s.bodyJson!==undefined?json(s.bodyJson):s.bodyText||s.note||'본문 없음'))+packetNote(packet,side)}
function packetPanel(title,p,side,key){const options=side==='request'?[['http','요청'],['value','본문 값']]:[['value','응답 값'],['http','HTTP 표시본']];const mode=UI.tabs[key]||options[0][0];return card(title,tabs(key,options)+'<div class="card-body">'+sideContent(p,side,mode)+'</div>','',p&&side==='response'?status(p.status):'')}
function packetPair(p,key='packet'){return '<div class="split">'+packetPanel('요청',p,'request',key+'-request')+packetPanel('응답',p,'response',key+'-response')+'</div>'}
function line(parts){return '<div class="result-line">'+parts.join('<span class="muted">·</span>')+'</div>'}
function selectionLine(p){return p?line(['<strong class="mono">'+E(p.method)+' '+E(path(p.url))+'</strong>',status(p.status),'<span class="muted">'+E(actor(p.actor))+'</span>']):''}
function trafficView(){const rows=filtered(D.traffic);const s=selected('traffic',rows,r=>path(r.url).startsWith('/check_balance/')&&Number(r.status)===200);const p=s.row?(D.packets.core||[]).find(x=>x.index===s.row.index):null;const list=card('요청·응답 '+count(rows.length)+'건',table('traffic',rows,[{label:'#',key:'index'},{label:'메서드',key:'method'},{label:'URL',value:r=>path(r.url)},{label:'상태',html:r=>status(r.status)},{label:'크기',value:r=>count(r.bodyBytes)+' B'}],s.index),'table-card fixed-table');return list+selectionLine(p)+packetPair(p,'traffic')+(p?'<div class="small muted hash">원본 '+E((p.originalIds||[]).join(' · '))+'</div>':'')}
function authView(){const cases=filtered(D.auth),s=selected('auth',cases,r=>r.id==='AUTH-IDOR-BALANCE'),r=s.row;if(!r)return empty();const baseline=r.cells.find(c=>c.kind==='REFERENCE')||r.cells[r.baseline];let right=r.cells.find(c=>c.actor===UI.authActor)||r.cells.find(c=>c.kind==='SUSPECT')||r.cells[0];const lp=packetFor(r.url,baseline.actor,baseline.status),rp=packetFor(r.url,right.actor,right.status);const accounts='<div class="account-grid">'+r.cells.map((c,i)=>'<div class="account"><strong>'+String.fromCharCode(65+i)+' &nbsp;'+E(actor(c.actor))+'</strong><div class="small">'+status(c.status)+' '+kindBadge(c.kind)+'</div></div>').join('')+'</div>';const cols=[{label:'메서드',key:'method'},{label:'요청 경로',value:x=>path(x.url)}].concat(r.cells.map(c=>({label:actor(c.actor),html:x=>{const cell=x.cells.find(z=>z.actor===c.actor);return status(cell.status)+(cell.kind==='REFERENCE'?' '+badge('기준','info'):'')}})),[{label:'검토 상태',html:x=>x.cells.some(c=>c.kind==='SUSPECT')?badge('우회 의심','warn'):badge('정책 대조','ok')}]);const top=card('비교 기록 · '+cases.length+'건',table('auth',cases,cols,s.index),'table-card fixed-table');let detail='';const tab=UI.tabs.authDetail||'responses';if(tab==='judgement')detail=table('auth-cells',r.cells,[{label:'계정',value:c=>actor(c.actor)},{label:'기대 정책',key:'expected'},{label:'HTTP',html:c=>status(c.status)},{label:'판정',html:c=>kindBadge(c.kind)},{label:'근거',key:'reason'}]);else detail='<div class="split">'+card(actor(baseline.actor)+' · 기준 응답','<div class="card-body">'+sideContent(lp,'response')+'</div>','',status(baseline.status))+card(actor(right.actor)+' · 비교 응답','<div class="card-body">'+sideContent(rp,'response')+'</div>','',status(right.status))+'</div>';const picker='<select data-control="authActor" aria-label="비교 계정">'+r.cells.map(c=>'<option value="'+E(c.actor)+'"'+(c.actor===right.actor?' selected':'')+'>'+E(actor(c.actor))+'</option>').join('')+'</select>';return accounts+top+card(r.method+' '+path(r.url),tabs('authDetail',[['responses','응답 비교'],['judgement','판정 근거']])+detail,'grow',picker)}
function payloadView(){const rows=filtered(D.payload.rows),s=selected('payload',rows,r=>String(r[5]).includes('SQL 조건 차이'));const r=s.row;const p=r?(D.packets.core||[]).find(p=>p.url.includes('/check_balance/')&&Number(p.status)===Number(r[2])&&decodeURIComponent(path(p.url)).includes(String(r[1]))):null;return line([badge('검사 완료','ok'),'<strong>실제 요청 5 / 최대 5</strong>','<span class="muted">SQL Injection · URL 인코딩 · 비로그인</span>'])+card('검사 결과 · '+rows.length+'건',table('payload',rows,D.payload.columns.map((name,i)=>({label:name,html:x=>i===2?status(x[i]):i===5?badge(x[i],String(x[i]).includes('후보')?'warn':'neutral'):E(x[i])})),s.index),'table-card fixed-table')+(r?line([badge(r[5],String(r[5]).includes('후보')?'warn':'neutral'),'<span>'+E(r[6])+'</span>']):'')+packetPair(p,'payload')}
function mapperView(){const m=D.mapper.metadata;const features=m.features||[],all=m.packets||[];const rows=filtered(all.filter(p=>UI.feature==='all'||p.primary===UI.feature));const s=selected('mapper',rows);const r=s.row;const groups='<div class="itemlist"><button class="item'+(UI.feature==='all'?' selected':'')+'" data-feature="all">전체 기능 <span class="muted">'+features.length+'</span></button>'+features.map(f=>'<button class="item'+(UI.feature===f.id?' selected':'')+'" data-feature="'+E(f.id)+'"><strong>'+E(f.name)+'</strong><div class="small muted">'+E(f.state)+' · '+E(f.entity)+'</div></button>').join('')+'</div>';const cols=[{label:'메서드',key:'method'},{label:'URL',value:p=>path(p.url)},{label:'상태',html:p=>status(p.status)},{label:'기능',key:'entity'},{label:'동작',key:'operation'}];const packet=r?packetFor(r.url,null,r.status):null;return line(['<strong>관측 '+D.mapper.packets+'항목</strong>','<span>기능 '+features.length+'개</span>','<span class="muted">일반 수집·통합 점검 관측 포함</span>'])+'<div class="list-grid">'+card('기능',groups)+ '<div class="stack">'+card('선택 기능의 요청 · '+rows.length+'건',table('mapper',rows,cols,s.index),'table-card')+card('관측 값','<div class="card-body">'+(r?kv([['메서드',r.method],['URL',r.url],['기능',r.entity],['동작',r.operation],['분류 근거',r.confidence],['요청 크기',r.requestBytes],['응답 크기',r.responseBytes]]):empty())+'</div>')+'</div></div>'}
function jsView(){const sources=D.js;const source=sources[UI.jsSource]||sources[0];const rows=filtered(source.endpoints||[]),s=selected('js',rows);const r=s.row;const p=packetFor(source.url.split('#')[0]);const picker='<select class="source-list" data-control="jsSource" aria-label="분석 원본">'+sources.map((x,i)=>'<option value="'+i+'"'+(i===UI.jsSource?' selected':'')+'>'+E(path(x.url))+' · '+x.endpoints.length+'</option>').join('')+'</select>';return card('분석 원본', '<div class="card-body">'+picker+'<div class="small muted">'+E(source.status)+'</div></div>')+'<div class="master-detail">'+card('API·URL 후보 · '+rows.length+'건',table('js',rows,[{label:'메서드',value:x=>x.method==='?'?'미확인':x.method},{label:'경로',key:'url'},{label:'상태',value:x=>x.complete?'경로 완성':'미완성·검토'}],s.index),'table-card')+card('선택 경로 · 원문', '<div class="card-body">'+(r?kv([['경로',r.url],['메서드',r.method==='?'?'미확인':r.method],['원본',source.url],['완성 여부',r.complete?'완성':'미완성 후보']]):'')+(p?sideContent(p,'response'):empty('저장된 원문 발췌가 없습니다.'))+'</div>')+'</div>'}
function environmentView(){const rows=filtered(D.paths),s=selected('environment',rows,r=>r.kind==='ENV');const r=s.row;const p=r?packetFor(r.url,null,r.status):null;const signals='<div class="tag-line">'+badge('Flask / Werkzeug','info')+badge('Swagger / OpenAPI','info')+badge('GraphQL · 본문 단서','neutral')+'</div>';return line(['<strong>'+E(D.environment[0]?.origin)+'</strong>',signals])+'<div class="master-detail">'+card('검증한 경로 · '+rows.length+'건',table('environment',rows,[{label:'경로',value:x=>path(x.url)},{label:'HTTP',html:x=>status(x.status)},{label:'분류',key:'kind'}],s.index),'table-card')+card('선택 경로',tabs('environment',[['response','응답'],['request','요청'],['basis','판정 근거']])+'<div class="card-body">'+(r?(UI.tabs.environment==='basis'?kv([['경로',r.url],['판정',r.state],['종류',r.kind]]):sideContent(p,UI.tabs.environment==='request'?'request':'response')):empty())+'</div>')+'</div>'}
function responseView(){const rows=filtered(D.response),s=selected('response',rows,r=>r.rule.includes('오류'));const r=s.row;const p=r?packetFor(r.url,null,r.rule.includes('오류')?500:null):null;return '<div class="tabbar"><span class="tab active">응답 관찰</span></div><div class="master-detail">'+card('분석 항목 · '+rows.length+'건',table('response',rows,[{label:'분석 항목',key:'rule'},{label:'위치',key:'location'},{label:'URL',value:r=>path(r.url)}],s.index),'table-card')+card('선택 항목',tabs('response',[['basis','분석 근거'],['value','응답 값']])+'<div class="card-body">'+(r?(UI.tabs.response==='value'?sideContent(p,'response'):kv([['항목',r.rule],['원본',r.url],['위치',r.location],['근거',r.evidence]])):empty())+'</div>')+'</div>'}
function activityView(){const rows=filtered(D.activity.data.endpoints||[]),s=selected('activity',rows,r=>r.observed>0);const r=s.row;let detail='';const tab=UI.tabs.activity||'details';if(r){if(tab==='parameters')detail=table('activity-params',r.parameters||[],[{label:'입력',key:'key'},{label:'완료',value:x=>x.completed?'완료':'미완료'},{label:'변경',value:x=>x.changed?'변경':'—'}]);else if(tab==='sources')detail=kv([['발견 출처',(r.sources||[]).join(' · ')],['근거',json(r.evidence||[])]]);else detail=kv([['메서드',r.method],['URL',r.url],['관측',r.observed],['Repeater',r.repeater],['완료',r.completed?'완료':'미완료'],['검토 메모',r.review||'—'],['Content-Type',r.contentType||'—']])}return line(['<strong>경로 '+D.activity.items+'항목</strong>','<span>완료 '+D.activity.data.endpoints.filter(x=>x.completed).length+'</span>','<span class="muted">계정·업무 연결 항목 0</span>'])+'<div class="master-detail">'+card('관측·진행 현황',table('activity',rows,[{label:'메서드',key:'method'},{label:'URL',value:x=>path(x.url)},{label:'관측',key:'observed'},{label:'상태',html:x=>badge(x.completed?'완료':x.observed>0?'관측':'미관측',x.completed?'ok':x.observed>0?'info':'neutral')}],s.index),'table-card')+card('URL 상세',tabs('activity',[['details','진행 상태'],['parameters','입력값'],['sources','발견 출처']])+'<div class="card-body">'+detail+'</div>')+'</div>'}
function bountyView(){const b=D.business,rows=filtered(b.steps),s=selected('bounty',rows,r=>r.method==='POST'),r=s.row;const p=r?(D.packets.business||[]).find(x=>x.index===r.step):null;return line([badge('재현 완료','ok'),'<span>실제 요청 '+b.actualHttpRequests+' / 한도 '+b.workflowRequestLimit+'</span>',badge('증거 자동 연결 미완료','warn')])+'<div class="three-column">'+card('증거 · '+D.evidence.items+'개','<div class="card-body">'+kv([['유형','익명 계좌 조회'],['ZIP 생성','완료'],['가림','적용'],['계정·업무 연결','미완료']])+'<div class="small muted hash">'+E(D.evidence.sha256)+'</div></div>')+'<div class="stack">'+card('재현 결과 · 음수 이체',table('bounty',rows,[{label:'순서',key:'step'},{label:'메서드',key:'method'},{label:'경로',value:x=>path(x.url)},{label:'HTTP',html:x=>status(x.status)}],s.index),'table-card')+card('응답의 실제 잔액','<div class="card-body compare-grid"><div><span class="muted">wb_alice</span><div class="number-big">'+b.senderBefore+' → '+b.senderAfter+'</div>'+badge('+5','warn')+'</div><div><span class="muted">wb_bob</span><div class="number-big">'+b.recipientBefore+' → '+b.recipientAfter+'</div>'+badge('−5','warn')+'</div></div>')+'</div>'+card('선택 단계',tabs('bounty',[['response','응답 값'],['request','요청 값'],['state','검증 조건']])+'<div class="card-body">'+(r?(UI.tabs.bounty==='state'?kv([['순서',r.step],['경로',r.url],['출력',r.productState],['이체 금액',b.fakeMoneyAmount]]):sideContent(p,UI.tabs.bounty==='request'?'request':'response')):empty())+'</div>')+'</div>'}
function dataView(){const active=UI.tabs.data||'compare';let body='';if(active==='jwt'){const match=D.jwt.decoded.match(/HEADER\n([\s\S]*?)\n\nPAYLOAD\n([\s\S]*?)\n\n/);const h=match?JSON.parse(match[1]):{},p=match?JSON.parse(match[2]):{};body=line([badge('서명 미검증','warn'),'<strong>'+E(D.jwt.account)+'</strong>',badge('exp 없음','neutral')])+'<div class="split">'+card('HEADER','<div class="card-body">'+raw(json(h))+'</div>')+card('PAYLOAD','<div class="card-body">'+raw(json(p))+'</div>')+'</div>'}else{const lp=(D.packets.core||[]).find(x=>x.response.bodyJson?.username==='wb_alice'&&Number(x.status)===200),rp=(D.packets.core||[]).find(x=>x.response.bodyJson?.username==='wb_bob'&&Number(x.status)===200);body=line([badge('변경 구간 '+D.data.changeCount+'개','info'),'<span class="muted">저장된 구조 비교 결과</span>'])+'<div class="split">'+card(D.data.leftAccount,'<div class="card-body">'+sideContent(lp,'response')+'</div>')+card(D.data.rightAccount,'<div class="card-body">'+sideContent(rp,'response')+'</div>')+'</div>'+card('변경 위치','<div class="card-body">'+raw(D.data.changes)+'</div>')}return tabs('data',[['compare','응답 비교'],['jwt','JWT 해석']])+body}
const CATEGORY={PATH:'경로',API:'API',INVENTORY:'명세',ENVIRONMENT:'환경',DATABASE:'DB',SECRET:'민감정보 후보',ACCESS:'계정·권한',ACCOUNT:'계정',PERMISSION:'권한',COVERAGE:'미확인·제한',RESPONSE:'응답',MENU:'메뉴',INTERNAL:'내부 경로'};
function findingDetail(r,tabKey){if(!r)return empty();const tab=UI.tabs[tabKey]||'basis',p=originalPacket(r.originalId);return tabs(tabKey,[['basis','선택 항목 근거'],['response','응답 값']])+'<div class="card-body">'+(tab==='response'?sideContent(p,'response'):kv([['항목',r.title],['종류',CATEGORY[r.category]||r.category],['계정',r.account],['중요도',r.severity],['상태',r.state],['신뢰도',r.confidence],['URL',r.url],['근거',r.detail],['원본 ID',r.originalId]]))+'</div>'}
function findingsTable(key,rows,s){return table(key,rows,[{label:'내용',key:'title'},{label:'경로',value:x=>path(x.url)},{label:'계정',key:'account'},{label:'중요도',html:x=>badge(x.severity,x.severity==='HIGH'?'warn':'neutral')},{label:'상태',key:'state'}],s.index)}
function scopeView(){let rows=D.scope.findings;if(UI.category)rows=rows.filter(x=>x.category===UI.category);rows=filtered(rows);const s=selected('scope',rows);const categories=[...new Set(D.scope.findings.map(x=>x.category))];const picker='<select data-control="category" aria-label="관측 분류"><option value="">모든 분류</option>'+categories.map(c=>'<option value="'+E(c)+'"'+(c===UI.category?' selected':'')+'>'+E(CATEGORY[c]||c)+'</option>').join('')+'</select>';return line([badge('COMPLETED','ok'),'<strong>전송 '+D.scope.sent+' · 완료 응답 '+D.scope.completed+'</strong>','<span>대기 '+D.scope.pending+' · 제외 '+D.scope.excluded+' · 실패 '+D.scope.failed+'</span>',badge('미확인 '+D.scope.partial,'warn')])+ '<div class="master-detail">'+card('관측·후보 · '+rows.length+'행',findingsTable('scope',rows,s),'table-card',picker)+card('상세',findingDetail(s.row,'scope-detail'))+'</div>'}
function dashboardView(){const key=UI.metric,metric=D.dashboardMetrics.find(x=>x.key===key);let rows;if(key==='paths')rows=D.scope.pages;else{const categories={api:['API','INVENTORY'],environment:['ENVIRONMENT','DATABASE'],secret:['SECRET'],access:['ACCESS','ACCOUNT','PERMISSION'],coverage:['COVERAGE']}[key]||[];rows=D.scope.findings.filter(x=>categories.includes(x.category))}if(UI.severity&&key!=='paths')rows=rows.filter(x=>x.severity===UI.severity);rows=filtered(rows);const s=selected('dashboard',rows);const cards='<div class="metric-grid">'+D.dashboardMetrics.map(m=>'<button class="metric'+(m.key===key?' active':'')+'" data-metric="'+m.key+'"><span>'+E(m.label)+'</span><strong>'+m.count+'</strong></button>').join('')+'</div>';let detail,list;if(key==='paths'){list=table('dashboard',rows,[{label:'관측 경로',value:r=>path(r.url)},{label:'계정',key:'account'},{label:'HTTP',html:r=>status(r.status)},{label:'분류',key:'classification'}],s.index);const r=s.row,p=r?originalPacket(r.originalId):null;detail=r?'<div class="card-body">'+kv([['URL',r.url],['계정',r.account],['분류',r.classification],['원본 ID',r.originalId]])+sideContent(p,'response')+'</div>':empty()}else{list=findingsTable('dashboard',rows,s);detail=findingDetail(s.row,'dashboard-detail')}return line([badge('최근 실행 완료','ok'),'<strong>127.0.0.1:24904</strong>','<span>전송 '+D.scope.sent+' · 처리 '+D.scope.completed+' · 미확인 '+D.scope.partial+'</span>'])+cards+'<div class="master-detail">'+card((metric?metric.label:'실행 결과')+' · '+rows.length+'행',list,'table-card')+card('선택 항목 근거',detail)+'</div>'}
function exposureView(){const isCve=UI.tabs.exposure==='cve';return tabs('exposure',[['search','검색 노출'],['cve','CVE 후보']])+line([badge('외부 조회 미실행','neutral'),'<span>관측 결과 0행</span>'])+card(isCve?'CVE 조회 조건':'생성한 검색식','<div class="card-body"><input class="field full-width mono" readonly aria-label="생성한 검색식" value="'+E(D.exposure.query)+'"></div>')+'<div class="split">'+card(isCve?'CVE 후보':'검색 결과',empty('저장된 외부 조회 결과가 없습니다.'))+card('조회 상태','<div class="card-body">'+kv([['외부 공급자 조회','미실행'],['CVE 결과',D.exposure.cveResultRows+'행'],['대상','127.0.0.1:24904']])+'</div>')+'</div>'}
const VIEWS={traffic:trafficView,auth:authView,payload:payloadView,mapper:mapperView,js:jsView,environment:environmentView,response:responseView,activity:activityView,bounty:bountyView,data:dataView,scope:scopeView,dashboard:dashboardView,exposure:exposureView};
function render(){const positions={};ROOT.querySelectorAll('[data-scroll]').forEach(x=>positions[x.dataset.scroll]=[x.scrollTop,x.scrollLeft]);const bodyScroll=ROOT.scrollTop;ROOT.innerHTML=VIEWS[UI.page]();ROOT.querySelectorAll('[data-scroll]').forEach(x=>{if(positions[x.dataset.scroll]){x.scrollTop=positions[x.dataset.scroll][0];x.scrollLeft=positions[x.dataset.scroll][1]}});ROOT.scrollTop=bodyScroll;const name=PAGES.find(p=>p[0]===UI.page);document.getElementById('breadcrumb').textContent=name[2]+' › '+name[1];document.getElementById('page-count').textContent=UI.q?'검색 적용':'';document.getElementById('footer-status').textContent=name[1]+' · '+(document.body.dataset.theme==='dark'?'다크':'라이트')+' · 실습 통화 $';navigation()}
function navigate(id){UI.page=id;UI.q='';document.getElementById('search').value='';ROOT.scrollTop=0;render()}
document.getElementById('navigation').addEventListener('click',event=>{const button=event.target.closest('[data-nav]');if(button)navigate(button.dataset.nav)});
ROOT.addEventListener('click',event=>{const tab=event.target.closest('[data-tab]');if(tab){UI.tabs[tab.dataset.tab]=tab.dataset.value;return render()}const metric=event.target.closest('[data-metric]');if(metric){UI.metric=metric.dataset.metric;UI.sel.dashboard=0;return render()}const feature=event.target.closest('[data-feature]');if(feature){UI.feature=feature.dataset.feature;UI.sel.mapper=0;return render()}const row=event.target.closest('[data-row]');if(row){UI.sel[row.dataset.row]=Number(row.dataset.index);render()}});
ROOT.addEventListener('keydown',event=>{if((event.key==='Enter'||event.key===' ')&&event.target.matches('[data-row]')){event.preventDefault();event.target.click()}});
ROOT.addEventListener('change',event=>{const key=event.target.dataset.control;if(!key)return;UI[key]=key==='jsSource'?Number(event.target.value):event.target.value;if(key==='jsSource')UI.sel.js=0;if(key==='category')UI.sel.scope=0;render()});
document.getElementById('search').addEventListener('input',event=>{UI.q=event.target.value;UI.sel[UI.page]=0;render()});
document.getElementById('theme-toggle').addEventListener('click',()=>{const dark=document.body.dataset.theme!=='dark';document.body.dataset.theme=dark?'dark':'light';document.getElementById('theme-toggle').textContent=dark?'☀':'☾';document.getElementById('theme-toggle').setAttribute('aria-label',dark?'라이트 화면으로 전환':'다크 화면으로 전환');render()});
document.getElementById('menu-toggle').addEventListener('click',()=>document.body.classList.toggle('nav-hidden'));
document.getElementById('export-data').addEventListener('click',()=>{const map={traffic:D.traffic,mapper:D.mapper,auth:D.auth,js:D.js,environment:{environment:D.environment,paths:D.paths},response:D.response,payload:D.payload,bounty:{evidence:D.evidence,business:D.business},data:{comparison:D.data,jwt:D.jwt},activity:D.activity,scope:D.scope,dashboard:D.dashboard,exposure:D.exposure};const url=URL.createObjectURL(new Blob([JSON.stringify(map[UI.page],null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='Workbench_'+UI.page+'_results.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
if(innerWidth<760)document.body.classList.add('nav-hidden');
window.WorkbenchSavedResults={data:D,state:UI,navigate,render};
render();
</script>
</body>
