<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workbench1.4.11 가이드·정리 검토</title><style>*{box-sizing:border-box}body{margin:0;background:#10161e;color:#e4ebf3;font:14px system-ui}header{padding:12px;display:flex;flex-wrap:wrap;gap:9px;align-items:center;border-bottom:1px solid #344355}select,button,a{font:inherit;color:inherit}select,button{border:1px solid #3b4b60;background:#1a2636;border-radius:6px;padding:8px;cursor:pointer}main{display:grid;grid-template-columns:235px 1fr}nav{padding:10px;display:flex;flex-direction:column;gap:5px}nav button{text-align:left}nav button.active{background:#653c29;border-color:#ff7832}article{padding:12px;min-width:0}p{line-height:1.6;color:#b4c4d8}#viewer{overflow:auto}img{width:100%;height:auto;border:1px solid #36465c;cursor:zoom-in}img.zoom{width:auto;max-width:none;cursor:zoom-out}a{color:#ffad77}@media(max-width:800px){main{grid-template-columns:1fr}nav{display:grid;grid-template-columns:1fr 1fr}}</style><header><strong>Workbench1.4.11</strong><select id="mode" aria-label="이미지 종류"><option value="guide">빨간 번호 사용 가이드</option><option value="review">빨간 박스 정리 검토</option><option value="after">정리 후 도구 예시</option></select><select id="theme" aria-label="테마"><option value="dark">어두움</option><option value="light">밝음</option></select><a id="original" target="_blank">원본 이미지</a><a href="README.md">설명</a></header><main><nav id="menu"></nav><article><h1 id="title"></h1><p id="notice"></p><div id="viewer"><img id="picture" alt=""></div></article></main><script>const data=[{"id": "traffic", "title": "요청·응답 목록", "guide": "images/guides/dark/guide-traffic.png", "guideLight": "images/guides/light/guide-traffic.png", "review": "images/cleanup/traffic.png", "after": "images/after/dark/traffic.png", "afterLight": "images/after/light/traffic.png"}, {"id": "mapper", "title": "기능 자동 매핑", "guide": "images/guides/dark/guide-mapper.png", "guideLight": "", "review": "images/clea ges/guides/dark/guide-data.png", "guideLight": "", "review": "images/cleanup/data.png", "after": "images/after/dark/data.png", "afterLight": "images/after/light/data.png"}, {"id": "activity", "title": "점검 진행 현황", "guide": "images/guides/dark/guide-activity.png", "guideLight": "", "review": "images/cleanup/activity.png", "after": "images/after/dark/activity.png", "afterLight": "images/after/light/activity.png"}, {"id": "bounty", "title": "재현·증거 정리", "guide": "images/guides/dark/guide-bounty.png", "guideLight": "", "review": "images/cleanup/bounty.png", "after": "images/after/dark/bounty.png", "afterLight": "images/after/light/bounty.png"}, {"id": "dashboard", "title": "점검 대시보드", "guide": "images/guides/dark/guide-dashboard.png", "guideLight": "", "review": "images/cleanup/dashboard.png", "after": "images/after/dark/dashboard.png", "afterLight": "images/after/light/dashboard.png"}, {"id": "payload.results", "title": "입력값 보안 검사 · 실행·결과", "guide": "images/guides/dark/guide-payload-results.png", "guideLight": "", "review": "", "after": "", "afterLight": ""}, {"id": "bounty.replay", "title": "재현·증거 정리 · 요청 재현", "guide": "images/guides/dark/guide-bounty-replay.png", "guideLight": "", "review": "", "after": "", "afterLight": ""}, {"id": "auth.accounts", "title": "계정 권한 비교 · 인증 후보 연결", "guide": "images/guides/dark/guide-auth-accounts.png", "guideLight": "", "review": "", "after": "", "afterLight": ""}];let index=0;const menu=document.getElementById('menu'),mode=document.getElementById('mode'),theme=document.getElementById('theme'),picture=document.getElementById('picture');data.forEach((screen,i)=>{const button=document.createElement('button');button.textContent=screen.title;button.onclick=()=>{index=i;show()};menu.append(button)});function show(){const screen=data[index];if(mode.value!=='guide'&&!screen[mode.value])mode.value='guide';let path=screen[mode.value];if(theme.value==='light'){const light=screen[mode.value+'Light'];if(light)path=light;else theme.value='dark'}document.getElementById('title').textContent=screen.title;document.getElementById('notice').textContent=mode.value==='review'?'적용 전 합성 화면 · 빨간 실선은 삭제 반영, 점선은 추가 검토 후보입니다.':mode.value==='guide'?'실제 가이드 창 · 합성 예시 · 빨간 번호와 오른쪽 단계 설명을 연결합니다.':'정리 후 실제 도구 컴포넌트 · 합성 예시';picture.src=path;picture.alt=screen.title;picture.classList.remove('zoom');document.getElementById('original').href=path;Array.from(menu.children).forEach((button,i)=>button.classList.toggle('active',i===index))}mode.onchange=show;theme.onchange=show;picture.onclick=()=>picture.classList.toggle('zoom');show();</script></html>
