<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>승인 시안 · 실제 구현 비교</title><style>body{margin:24px;font:15px system-ui;background:#f4f7fa;color:#26334b}select{padding:10px;font:inherit}main{display:grid;grid-template-columns:1fr 1fr;gap:16px}img{width:100%;border:1px solid #dde3eb}h1{font-size:22px}p{line-height:1.7}a{color:#315fa1}@media(max-width:950px){main{grid-template-columns:1fr}}</style><h1>승인 시안과 Simple 1.4.6 실제 구현</h1><p>왼쪽은 승인된 생성 시안, 오른쪽은 운영 Swing 화면입니다. 예시 데이터와 글자 렌더링은 다릅니다. 본문 제목 제거, 공통 메뉴·상단 바, 도구별 정보 구조와 동작 배치를 대조합니다.<br>실제 Burp Community GUI·Windows DPI/IME는 미검증입니다.</p><select id="tool"></select><main><section><h2>승인 시안</h2><img id="reference" alt="승인 시안"></section><section><h2>실제 구현 · 합성 패킷</h2><a id="full"><img id="actual" alt="실제 Swing 구현"></a></section></main><script>const items=[["01-traffic", "요청·응답 목록"], ["02-mapper", "기능 자동 매핑"], ["03-auth", "계정 권한 비교"], ["04-js", "JS에서 API 찾기"], ["05-environment", "서버·경로 탐색"], ["06-response", "응답 보안 분석"], ["07-payload", "입력값 보안 검사"], ["08-evidence", "재현·증거 정리"]];const select=document.querySelector('#tool');for(const [id,title] of items){let o=document.createElement('option');o.value=id;o.textContent=title;select.append(o)}function update(){let id=select.value;document.querySelector('#reference').src='reference/'+id+'.png';let path='../../images/1.4.6/'+id+'-light.png';document.querySelector('#actual').src=path;document.querySelector('#full').href=path}select.onchange=update;update();</script></html>
