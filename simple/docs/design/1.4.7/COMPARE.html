<!doctype html><html lang="ko"><meta charset="utf-8"><title>Simple 1.4.7 디자인 비교</title><style>body{margin:0;background:#f5f8fc;color:#29374c;font:15px system-ui,sans-serif}header{padding:22px 28px;background:white;border-bottom:1px solid #dce5ef}h1{font-size:22px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}button,select{padding:9px 13px;background:white;border:1px solid #dce5ef;border-radius:6px;color:inherit;cursor:pointer}button[aria-pressed=true]{border-color:#ff6525;background:#ffebe0}main{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:16px}figure{margin:0;min-width:0}figcaption{padding:10px;font-weight:600}img{width:100%;border:1px solid #dce5ef;border-radius:6px;background:white}p{line-height:1.7}a{color:#1f5beb}@media(max-width:900px){main{grid-template-columns:1fr}}.full{grid-template-columns:1fr}.full figure:first-child{display:none}</style><header><h1>Simple 1.4.7 · 세부 디자인 비교</h1><p>오른쪽은 실제 Swing 화면입니다. 합성 데이터로 렌더링했으며 실제 Burp GUI 검증은 별도입니다. 시안의 예시 계정·수치·판정을 제품에 넣지 않았습니다.</p><nav id="tools"></nav><label>비교 대상 <select id="before"><option value="reference">승인 시안</option><option value="previous">이전 1.4.6</option></select></label> <label>구현 테마 <select id="theme"><option value="light">밝게</option><option value="dark">어둡게</option></select></label> <button id="solo">현재 화면 크게 보기</button> <a href="../../images/1.4.7/README.md">8개 도구 이미지 목록</a></header><main id="main"><figure><figcaption id="caption"></figcaption><a id="oldlink" target="_blank"><img id="old" alt="비교 이미지"></a></figure><figure><figcaption id="title"></figcaption><a id="newlink" target="_blank"><img id="new" alt="실제 구현"></a></figure></main><script>const items=[{"key": "01-traffic", "title": "요청·응답 목록"}, {"key": "02-mapper", "title": "기능 자동 매핑"}, {"key": "03-auth", "title": "계정 권한 비교"}, {"key": "04-js", "title": "JS에서 API 찾기"}, {"key": "05-environment", "title": "서버·경로 탐색"}, {"key": "06-response", "title": "응답 보안 분석"}, {"key": "07-payload", "title": "입력값 보안 검사"}, {"key": "08-evidence", "title": "재현·증거 정리"}];let current=items[0];const $=id=>document.getElementById(id);for(const item of items){const b=document.createElement('button');b.textContent=item.title;b.onclick=()=>{current=item;render()};b.dataset.key=item.key;$('tools').append(b)}function render(){for(const b of $('tools').children)b.setAttribute('aria-pressed',b.dataset.key===current.key);const theme=$('theme').value,ref=$('before').value==='reference';$('old').src=ref?'../1.4.6/reference/'+current.key+'.png':'../../images/1.4.6/'+current.key+'-'+theme+'.png';$('new').src='../../images/1.4.7/'+current.key+'-'+theme+'.png';$('oldlink').href=$('old').src;$('newlink').href=$('new').src;$('caption').textContent=ref?'승인 시안':'이전 1.4.6';$('title').textContent=current.title+' · 실제 구현 1.4.7'}$('theme').onchange=render;$('before').onchange=render;$('solo').onclick=()=>{const full=$('main').classList.toggle('full');$('solo').textContent=full?'나란히 비교':'현재 화면 크게 보기'};render();</script></html>
