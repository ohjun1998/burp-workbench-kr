<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workbench1.4.10 구현 화면</title><style>*{box-sizing:border-box}body{margin:0;background:#10151d;color:#e3e8f0;font:14px system-ui}header{padding:12px 18px;border-bottom:1px solid #303b49;display:flex;align-items:center;gap:12px}button,select,a{font:inherit;color:inherit}button,select{border:1px solid #354253;border-radius:7px;background:#1b2430;padding:8px 10px;cursor:pointer}button:hover,button.active{background:#583826;border-color:#ff7a32}main{display:grid;grid-template-columns:215px 1fr}nav{padding:10px;display:flex;flex-direction:column;gap:5px}nav button{text-align:left}article{padding:14px;min-width:0}img{width:100%;height:auto;border:1px solid #344052;border-radius:7px;cursor:zoom-in}img.zoom{width:auto;max-width:none;cursor:zoom-out}p{color:#a9b8cb;line-height:1.5}#viewer{overflow:auto}#title{font-size:16px}a{color:#ff9a61}@media(max-width:700px){main{grid-template-columns:1fr}nav{display:grid;grid-template-columns:1fr 1fr}}</style><header><strong>Workbench1.4.10 · 구현 화면</strong><select id="theme" aria-label="테마"><option value="dark">어두운 테마</option><option value="light">밝은 테마</option></select><button id="prev">이전</button><button id="next">다음</button><a href="README.md">목록</a></header><main><nav id="menu"></nav><article><h1 id="title"></h1><p>실제 Swing 컴포넌트 · 합성 데이터. 이미지를 누르면 원본 크기로 표시합니다. ← →로 도구를 이동합니다.</p><div id="viewer"><img id="screen" alt=""></div></article></main><script>const data=[{"slug": "01-traffic", "title": "요청·응답 목록"}, {"slug": "02-mapper", "title": "기능 자동 매핑"}, {"slug": "03-js", "title": "JS에서 API 찾기"}, {"slug": "04-environment", "title": "서버·경로 탐색"}, {"slug": "05-exposure-search", "title": "외부 노출 조사 · 검색 노출"}, {"slug": "06-exposure-cve", "title": "외부 노출 조사 · CVE 후보"}, {"slug": "07-auth", "title": "계정 권한 비교"}, {"slug": "08-response", "title": "응답 보안 분석"}, {"slug": "09-payload", "title": "입력값 보안 검사"}, {"slug": "10-data", "title": "데이터 변환·비교"}, {"slug": "11-progress", "title": "점검 진행 현황"}, {"slug": "12-evidence", "title": "재현·증거 정리"}, {"slug": "13-dashboard", "title": "점검 대시보드"}];let index=0;const menu=document.getElementById('menu'),screen=document.getElementById('screen'),theme=document.getElementById('theme');data.forEach((item,i)=>{const button=document.createElement('button');button.textContent=item.title;button.onclick=()=>{index=i;show()};menu.append(button)});function show(){const item=data[index];document.getElementById('title').textContent=item.title;screen.src=theme.value+'/tools/'+item.slug+'.png';screen.alt=item.title;screen.classList.remove('zoom');Array.from(menu.children).forEach((button,i)=>button.classList.toggle('active',i===index))}theme.onchange=show;function move(delta){index=(index+delta+data.length)%data.length;show()}document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);screen.onclick=()=>screen.classList.toggle('zoom');document.onkeydown=event=>{if(event.target.tagName==='SELECT')return;if(event.key==='ArrowLeft')move(-1);if(event.key==='ArrowRight')move(1)};show();</script></html>
